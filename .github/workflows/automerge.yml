name: Auto-merge when QA passes

# Turns on GitHub auto-merge only when the repository owner both opened the pull
# request and made the triggering push, from a branch in this repository. Pull
# requests from forks, other accounts and bots (including Dependabot) are never
# armed, so they wait for a manual merge by the owner. GitHub then merges only
# after every branch protection rule passes, including the required
# "DevKit QA gate" check. If the gate fails, nothing merges.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
